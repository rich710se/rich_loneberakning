<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Löneberäkning">
    <title>Rich Löneberäkning v2027.4</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --primary: #0284c7;
            --emerald: #10b981;
            --emerald-bg: rgba(16, 185, 129, 0.15);
            --amber: #f59e0b;
            --indigo: #6366f1;
            --rose: #f43f5e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-body); color: var(--text-primary); padding-bottom: 40px; }
        header { background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 16px; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; }
        .header-title { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 36px; height: 36px; background: var(--primary); color: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; }
        .header-text h1 { font-size: 16px; font-weight: 700; }
        .header-text p { font-size: 11px; color: var(--text-secondary); }
        .container { max-width: 500px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        .card-header { border-bottom: 1px solid var(--border-color); padding-bottom: 8px; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        input[type="number"] { width: 100%; padding: 10px 36px 10px 12px; border: 1px solid var(--border-color); border-radius: 10px; background-color: #0f172a; color: #ffffff; font-size: 16px; font-weight: 600; text-align: right; outline: none; }
        input[type="number"]:focus { border-color: var(--primary); }
        .unit { position: absolute; right: 10px; font-size: 12px; color: var(--text-secondary); pointer-events: none; }
        .rate-hint { font-size: 11px; color: var(--text-secondary); text-align: right; margin-top: 2px; }
        input[type="range"] { width: 100%; height: 6px; border-radius: 5px; background: var(--border-color); outline: none; accent-color: var(--primary); }
        .result-box { background-color: var(--emerald-bg); border: 1px solid rgba(16, 185, 129, 0.4); border-radius: 14px; padding: 16px; text-align: center; }
        .result-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--emerald); letter-spacing: 0.5px; }
        .result-amount { font-size: 34px; font-weight: 800; color: var(--emerald); margin-top: 4px; }
        .summary-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); padding: 4px 0; }
        .summary-row.total { border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: 6px; font-weight: 700; color: var(--text-primary); font-size: 15px; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; }
        .btn-calc { background-color: var(--emerald); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-reset { background: none; border: none; color: var(--primary); font-size: 11px; font-weight: 600; cursor: pointer; text-decoration: underline; }
        .bar-chart { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 10px; background-color: var(--border-color); }
        .bar-segment { height: 100%; transition: width 0.3s ease; }
        .bg-net { background-color: var(--emerald); }
        .bg-tax { background-color: var(--rose); }
        .legend { display: flex; gap: 12px; justify-content: center; margin-top: 8px; font-size: 11px; color: var(--text-secondary); }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
        .auto-tag { font-size: 10px; background: rgba(2, 132, 199, 0.2); color: var(--primary); padding: 2px 6px; border-radius: 4px; margin-left: 4px; }
    </style>
</head>

        <div class="header-title">
            <div class="logo-icon">kr</div>
            <div class="header-text">
                <h1>Rich Löneberäkning</h1>
                <p>v2027.4 (Tabell 32 Auto)</p>
            </div>
        </div>
    </header>

    <div class="container">

                <div class="result-title">Lön efter skatt (Nettolön)</div>
                <div class="result-amount" id="netSalary">0 kr</div>
            </div>
            <div style="display:flex; flex-direction:column; gap:2px;">
                <div class="summary-row"><span>Månadslön:</span><span id="sumBase">0 kr</span></div>
                <div class="summary-row"><span>Övertidstillägg:</span><span id="sumOT" style="color:var(--amber);">+ 0 kr</span></div>
                <div class="summary-row"><span>Beredskapstillägg:</span><span id="sumSB" style="color:var(--indigo);">+ 0 kr</span></div>
                <div class="summary-row"><span>Sjukavdrag:</span><span id="sumSick" style="color:var(--rose);">- 0 kr</span></div>
                <div class="summary-row total"><span>Bruttolön:</span><span id="grossSalary">0 kr</span></div>
                <div class="summary-row" style="font-size:12px;"><span>Skatt (<span id="taxRateLabel">0.0%</span>):</span><span id="taxDeduction" style="color:var(--rose);">- 0 kr</span></div>
            </div>
            <div>
                <div class="bar-chart">
                    <div id="barNet" class="bar-segment bg-net" style="width: 67%;"></div>
                    <div id="barTax" class="bar-segment bg-tax" style="width: 33%;"></div>
                </div>
                <div class="legend">
                    <div class="legend-item"><div class="legend-dot bg-net"></div> Netto</div>
                    <div class="legend-item"><div class="legend-dot bg-tax"></div> Skatt</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <span>💰 Grundlön & Skatt</span>
                <button id="resetTaxBtn" class="btn-reset" onclick="resetToAutoTax()" style="display:none;">Återställ till Tabell 32</button>
            </div>
            <div class="grid-2">
                <div class="input-group">
                    <label for="monthlySalary">Månadslön (kr)</label>
                    <div class="input-wrapper">
                        <input type="number" id="monthlySalary" value="35000" inputmode="decimal">
                        <span class="unit">kr</span>
                    </div>
                </div>
